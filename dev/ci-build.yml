name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m py_compile cheerdots/*.py

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER=$(python3 -c "import cheerdots; print(cheerdots.__version__)")
          test "v$VER" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != version $VER"; exit 1; }

      - name: Build .deb
        run: bash packaging/build-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cheerdots-deb
          path: dist/*.deb

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
